<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Big Number Simulator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Big Number Simulator</h1>
    
    <div class="controls">
      <div class="input-group">
        <label for="mantissa">Starting Mantissa:</label>
        <input type="text" id="mantissa" value="1e15">
      </div>
      
      <div class="input-group">
        <label for="exponent">Starting Exponent:</label>
        <input type="number" id="exponent" value="308">
      </div>
      
      <div class="input-group">
        <label for="steps">Number of Steps:</label>
        <input type="number" id="steps" value="100">
      </div>

      <div class="input-group">
        <label for="stepSize">Step Size:</label>
        <input type="text" id="stepSize" value="1">
      </div>

      <button id="simulate">Simulate</button>
    </div>

    <div class="display-options">
      <h3>Display Options</h3>
      <label>
        <input type="radio" name="displayMode" value="plain" checked>
        Plain Text
      </label>
      <label>
        <input type="radio" name="displayMode" value="bars">
        Animated Bars
      </label>
      <label>
        <input type="radio" name="displayMode" value="graph">
        Line Graph
      </label>
    </div>

    <div class="output-container">
      <div id="plainOutput" class="output-panel active"></div>
      <div id="barOutput" class="output-panel">
        <div class="bar-container"></div>
      </div>
      <div id="graphOutput" class="output-panel">
        <canvas id="graphCanvas"></canvas>
      </div>
    </div>
  </div>
  
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script type="module" src="main.js"></script>

</body>
</html>
